<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1012">
<meta name="description" content="Workout tracker with a built-in coach: sets, reps, weights, rest timer, 90+ exercises with form cues, training splits, progressive overload plans and a supplement guide.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Repwise</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1012;--s1:#1A1C20;--s2:#24272C;--line:#2E3238;--line2:#3A3F46;--tx:#F2F3F0;--mut:#A3A8B0;--dim:#8A9099;--acc:#C8F031;--warn:#FF9F5A;--nav:72px}
*{box-sizing:border-box}
html,body{margin:0;background:#08090A;color:var(--tx);font-family:'Barlow',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0;line-height:1.5;font-size:14px;color:#D6D9DD}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){#app{height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:28px;border:1px solid #22252A}}
header{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid #22252A}
.brand{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1,.h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1;text-transform:uppercase}
.h1{font-size:34px}
.h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;line-height:1}
.h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase}
.mt{margin-top:10px}
main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 16px calc(var(--nav) + 120px);scrollbar-width:none}
main::-webkit-scrollbar,.detail::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.tight{padding:14px;gap:4px;border-radius:14px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card.hl{border-color:var(--acc)}
.row{display:flex;align-items:center;gap:8px}
.row.top{align-items:flex-start}.row.between{justify-content:space-between;align-items:baseline}.row.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.muted{color:var(--mut)}.dim{color:var(--dim)}.acc{color:var(--acc)}.warn{color:var(--warn)}
.small{font-size:13px}.tiny{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.big{font-size:15px}
.cond{font-family:'Barlow Condensed',sans-serif;font-weight:700}.up{text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.eyebrow.acc{color:var(--acc)}.eyebrow.warn{color:var(--warn)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.group{display:flex;flex-direction:column;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{height:52px;border-radius:14px;border:0;font-size:16px;font-weight:700;padding:0 16px}
.btn.sm{height:44px;font-size:14px;border-radius:12px;padding:0 14px}
.btn.acc{background:var(--acc);color:#0F1012}
.btn.ghost{background:none;border:1px solid var(--line2);font-weight:600}
.btn.line{background:none;border:1px solid #C9CCD0;color:#0F1012}
.btn.dark{background:#0F1012;color:#F2F3F0}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:0;background:var(--s2);color:var(--mut);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px}.chips.wrap{flex-wrap:wrap}
.chips.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:var(--s2)}
.chips.scroll .chip{background:var(--s1);border-color:var(--line)}
.chip.on,.chips.scroll .chip.on{background:var(--acc);border-color:var(--acc);color:#0F1012}
.chip.passed{color:var(--mut)}
.seg{display:flex;gap:4px}.seg .chip{flex:1 1 0;min-width:0;padding:0;border-radius:10px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:48px;width:100%;border-radius:12px;border:1px solid var(--line2);background:var(--s2);padding:0 12px;font-size:18px;font-weight:600;outline:none}
.field input:focus,.search:focus-within{border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.mini{display:flex;flex-direction:column;gap:2px}.mini span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}.mini b{font-family:'Barlow Condensed',sans-serif;font-size:24px}
.coachline{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--s2);border:0;border-radius:12px;padding:10px 12px;color:#D6D9DD;font-size:13px;line-height:1.4;min-height:44px}
.coachline span{flex:1 1 auto}.coachline b{white-space:nowrap}
.empty{border:1px dashed var(--line2);border-radius:18px;padding:24px 20px;text-align:center;color:var(--mut);font-size:15px;line-height:1.5}
.exname{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-width:0}
.exname b{font-size:18px;line-height:1.2}.exname span{font-size:13px}
.cue{font-size:13px;line-height:1.4;color:#D6D9DD;background:var(--s2);border-radius:10px;padding:8px 10px}
.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.sethead{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;padding:0 2px}
.sethead span:not(:first-child){text-align:center}
.setrow{border-radius:12px;padding:2px}.setrow.done{background:rgba(200,240,49,.12)}
.sn{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;text-align:center;color:var(--mut)}
.stepper{display:flex;align-items:center;background:var(--s2);border-radius:12px;overflow:hidden}
.stepper button{width:38px;height:44px;border:0;background:none;font-size:20px;flex:0 0 38px}
.stepper span{flex:1 1 auto;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.check{width:44px;height:44px;border-radius:12px;border:0;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--mut)}
.setrow.done .check{background:var(--acc);color:#0F1012}
.resting{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;background:var(--acc);color:#0F1012;font-size:14px;font-weight:600}
.resting span{flex:1 1 auto}.resting b{font-family:'Barlow Condensed',sans-serif;font-size:24px}
.tip{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;background:#1F2A12;border:1px solid #3F5520;font-size:14px;line-height:1.45;color:#E4F2C4}
.tip svg{flex:0 0 18px;color:var(--acc);margin-top:1px}
.rest{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:12px;padding-left:10px;color:var(--mut)}
.rest button{width:34px;height:44px;border:0;background:none;font-size:18px;color:var(--tx)}
.rest b{font-family:'Barlow Condensed',sans-serif;font-size:20px;min-width:40px;text-align:center;color:var(--tx)}
.rest .small{margin-left:4px}
.histrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.histrow:last-child{border-bottom:0}.histrow div{display:flex;flex-direction:column;gap:2px}
.tile{background:var(--s2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tv{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.15}
.ts{font-size:12px;color:var(--mut)}
.grid2 .tile:first-child .tv{color:var(--acc)}
.inset{background:var(--s2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.num{flex:0 0 28px;height:28px;border-radius:99px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--acc)}
.step span:last-child{padding-top:2px}
.weeks{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wk{display:grid;grid-template-columns:64px 64px 76px 1fr;gap:8px;align-items:center;padding:10px 12px;background:var(--s2);border-bottom:1px solid var(--line);font-size:13px}
.wk:nth-child(even){background:#1F2125}.wk:last-child{border-bottom:0}
.wk b{font-family:'Barlow Condensed',sans-serif;font-size:19px}
.ladder{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ladder .chip{min-height:36px;padding:0 10px;font-size:13px}
.bullet{display:flex;gap:10px;font-size:14px;line-height:1.5;color:#D6D9DD}.bullet span:first-child{font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;color:var(--mut)}
.search input{flex:1 1 auto;min-width:0;background:none;border:0;outline:none;font-size:16px;color:var(--tx)}
.exitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px}
.exitem b{font-size:16px}.right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.right .cond{font-size:18px}
.acc-head{width:100%;background:none;border:0;text-align:left;padding:14px 16px;display:flex;align-items:center;gap:12px}
.acc-head b{font-size:17px}
.acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.badge{flex:0 0 52px;height:52px;border-radius:14px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.badge b{font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1}.badge span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.chev{font-size:22px;color:var(--mut)}
.day{background:var(--s2);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}.day b{font-size:18px}
.tier{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:99px;color:#0F1012}
.warnbox{border:1px solid #5A3E2A;background:#241A13;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:#F1D9C6;display:flex;flex-direction:column;gap:6px}
.warnbox p{color:#F1D9C6;font-size:15px}
.detail{position:absolute;inset:0 0 var(--nav) 0;background:var(--bg);z-index:5;overflow-y:auto;scrollbar-width:none}
.dhead{padding:calc(16px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:10px}
.dbody{padding:14px 20px 120px}
.timer{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + 12px);z-index:6;background:#F2F3F0;color:#0F1012;border-radius:18px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer .eyebrow{color:#4A4F57}.timer.fin{background:var(--acc)}
.tbig{font-family:'Barlow Condensed',sans-serif;font-size:34px;line-height:1}
.tbar{height:6px;background:#D8DBDF;border-radius:99px;overflow:hidden}.tbar div{height:100%;background:#0F1012;border-radius:99px;transition:width .25s linear}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:7;background:#15171A;border-top:1px solid #22252A;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--dim)}
nav button.on{color:var(--acc)}
.toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;background:var(--acc);color:#0F1012;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script>

var MUSCLES = [
  ['chest','Chest'],['back','Back'],['shoulders','Shoulders'],['biceps','Biceps'],['triceps','Triceps'],
  ['quads','Quads'],['hams','Hams & Glutes'],['calves','Calves'],['core','Core'],['forearms','Forearms']
];

var GUIDES = {
  chest: { feel: 'A deep stretch across the chest at the bottom and a squeeze as your arms come together. Front delts and triceps help, but the chest should do most of the work.', load: 'Heavy presses at 5–8 reps first, then dumbbell or machine presses at 8–12 and flyes at 10–15.', fix: 'Feel it all in your shoulders? Pinch shoulder blades back and down, drop the incline to 30°, and keep elbows under ~70° from your body.' },
  back: { feel: 'Lats (the sides of your back under the armpits) stretching at the top of pulls, and the mid-back pinching together on rows. You should NOT mainly feel biceps or forearms.', load: 'Back takes heavy loads well: rows & pulldowns 6–12, deadlifts 3–6. Heavy only counts if the reps are clean — no swinging.', fix: 'Only feel your arms? Use lifting straps, think "pull with the elbows, hands are hooks", pause 1 s at the squeeze, and drop the weight 10–20% until your back does the work.' },
  shoulders: { feel: 'Side delts burn on raises (outer shoulder — not your neck). Front delts work on presses; rear delts on face pulls and reverse flyes.', load: 'Presses heavy at 5–10. Lateral and rear raises light at 12–20 — delts respond best to high reps and constant tension.', fix: 'Traps taking over on raises? Go lighter, lean slightly forward, lead with your elbows and stop at shoulder height.' },
  biceps: { feel: 'Front of the upper arm: a stretch at the bottom (incline curls), a hard squeeze at the top.', load: 'Moderate weight, 8–15 reps. Biceps are small — heavy cheat curls shift the work to your back and shoulders.', fix: 'Pin your elbows at your sides, no hip swing, and lower in 2–3 seconds.' },
  triceps: { feel: 'Back of the upper arm — near the elbow on pushdowns, a long stretch on overhead extensions.', load: 'Go heavy on close-grip bench and dips (5–8 reps). Extensions and pushdowns at 8–15. Overhead work hits the long head, the biggest part of the triceps.', fix: 'Elbow pain? Switch to rope or cables, use 12–15 reps and warm up with 2 light sets.' },
  quads: { feel: 'Front of the thighs, burning near the knee at the bottom. The deeper your knees bend, the more quads work.', load: 'Squats and hack squats heavy at 4–10; leg press and lunges 8–15; leg extensions 10–15.', fix: 'Feel it in your lower back instead? Brace harder, try heels-elevated squats or a machine (hack squat, leg press).' },
  hams: { feel: 'A big stretch at the back of the thighs on RDLs, a cramp-like squeeze on curls, glutes at the top of hip thrusts.', load: 'RDLs heavy at 6–10; leg curls 8–12 controlled; hip thrusts 8–12 heavy.', fix: 'Lower back taking over on RDLs? Shorten the range — stop when your hips stop moving back — and keep the bar touching your legs.' },
  calves: { feel: 'A deep stretch at the bottom, a cramp at the top.', load: 'Heavy, 8–15 reps, with a 1–2 s pause in the stretch. Bouncing reps build almost nothing.', fix: 'Slow down: full stretch, pause, rise all the way onto your toes.' },
  core: { feel: 'Abs tighten as your spine curls (crunches, leg raises); anti-rotation moves make you fight twisting.', load: 'Train abs like any muscle: 8–15 reps, add weight when it gets easy. 2–3 sessions a week is plenty.', fix: 'Hip flexors burning on leg raises? Curl your pelvis up toward your ribs instead of just lifting the legs.' },
  forearms: { feel: 'Grip burning and a forearm pump.', load: 'High reps (12–20) on curls; heavy carries for grip strength.', fix: 'Heavy rows and deadlifts already train grip — add direct work only if forearms lag.' }
};

// id, name, muscle, equipment, kind (C/I), reps, load, feel, steps (|), mistake
var EX = [
  ['bench','Barbell Bench Press','chest','Barbell','C','5–8','Heavy','Chest stretch at the bottom, triceps at lockout.','Pinch shoulder blades down and back, feet planted, slight arch|Lower under control to mid/lower chest, elbows 45–70° from body|Drive up and slightly back toward your face','Bouncing the bar off your chest or flaring elbows to 90°.'],
  ['incdb','Incline Dumbbell Press','chest','Dumbbells','C','6–10','Moderate–heavy','Upper chest, just under the collarbone.','Set the bench to about 30° — steeper turns it into a shoulder press|Lower the dumbbells to upper-chest level for a deep stretch|Press up and slightly in; don\'t clank them at the top','Bench too steep, so front delts do the work.'],
  ['dbbench','Flat Dumbbell Press','chest','Dumbbells','C','6–10','Moderate–heavy','Whole chest, with a deeper stretch than the barbell.','Kick the dumbbells up off your knees, shoulder blades pinched|Lower until you feel a big chest stretch, wrists over elbows|Press up in a slight arc','Cutting the range short to lift heavier.'],
  ['incbb','Incline Barbell Press','chest','Barbell','C','5–8','Heavy','Upper chest and front delts.','Bench at 30°, grip slightly wider than shoulders|Lower to just under the collarbone|Press straight up, keep shoulder blades pinned','Lifting the hips off the bench to finish reps.'],
  ['machpress','Machine Chest Press','chest','Machine','C','8–12','Moderate–heavy','Chest squeezing hard — safe to push close to failure.','Set the seat so handles line up with mid-chest|Press out without locking shoulders forward|Return slowly until you feel a stretch','Seat too high, so shoulders take over.'],
  ['dipchest','Chest Dip','chest','Bodyweight / belt','C','6–12','Bodyweight → weighted','Lower chest stretch at the bottom.','Lean your torso forward, elbows slightly out|Lower until upper arms are about parallel to the floor|Push up without fully locking out','Going too deep with shoulders rolling forward — stop if they ache.'],
  ['cablefly','Cable Fly','chest','Cable','I','10–15','Light–moderate','A stretch across the chest, then a squeeze as hands meet.','Set pulleys at shoulder height, step forward, soft elbows|Open wide until you feel the chest stretch|Hug a big tree — bring hands together and squeeze 1 s','Bending the elbows more each rep so it turns into a press.'],
  ['pecdeck','Pec Deck','chest','Machine','I','10–15','Moderate','Inner and mid chest squeeze.','Seat so handles are at chest height|Bring arms together with a slight elbow bend|Control back to a full stretch','Letting the stack slam and losing tension.'],
  ['pushup','Push-Up','chest','Bodyweight','C','10–25','Bodyweight','Chest and triceps; core stays tight.','Hands just wider than shoulders, body in a straight line|Lower until your chest nearly touches the floor|Push up as one unit','Hips sagging or half-reps.'],

  ['deadlift','Deadlift','back','Barbell','C','3–6','Heavy','Hamstrings, glutes and a fully braced back. The lower back should feel tight, never painful.','Bar over mid-foot, hip-width stance, grip just outside your legs|Brace hard, pull the slack out of the bar, chest up|Push the floor away; hips and shoulders rise together; finish with glutes','Rounding the lower back or yanking the bar off the floor.'],
  ['pullup','Pull-Up','back','Bodyweight / belt','C','5–10','Bodyweight → weighted','Lats — the sides of your back under the armpits.','Hang fully with shoulders slightly pulled down|Drive your elbows down toward your back pockets|Chin over the bar, lower slowly to a full hang','Half reps and kipping.'],
  ['pulldown','Lat Pulldown','back','Cable','C','8–12','Moderate–heavy','Lats stretching at the top, squeezing at the bottom.','Thighs locked under the pad, grip a bit wider than shoulders|Lean back slightly and pull the bar to your upper chest, leading with elbows|Let your arms stretch fully overhead each rep','Leaning far back and pulling with the biceps.'],
  ['bbrow','Barbell Row','back','Barbell','C','6–10','Heavy','Mid-back and lats; shoulder blades squeeze together.','Hinge to about 45°, flat back, bar hanging at your knees|Row to your lower ribs, elbows about 45° from the body|Pause, then lower with control','Standing more upright each rep and using momentum.'],
  ['csrow','Chest-Supported T-Bar Row','back','Machine','C','8–12','Heavy','Pure upper back — no lower back fatigue.','Chest on the pad, arms long, let shoulders stretch forward|Pull elbows back past your torso|Squeeze 1 s, lower slowly','Lifting the chest off the pad to heave the weight.'],
  ['cablerow','Seated Cable Row','back','Cable','C','8–12','Moderate–heavy','Mid-back and lats, with a stretch at the front.','Sit tall, slight knee bend|Pull the handle to your belly, elbows close to your sides|Reach forward to stretch, keeping the back flat','Rocking the torso back and forth.'],
  ['dbrow','One-Arm Dumbbell Row','back','Dumbbell','C','8–12','Heavy','Lat on the working side.','Hand and knee on a bench, back flat|Pull the dumbbell toward your hip, not your armpit|Lower to a full stretch','Twisting the torso to swing the weight up.'],
  ['sapull','Straight-Arm Pulldown','back','Cable','I','12–15','Light–moderate','Lats only — no biceps at all.','Stand facing the cable, arms straight, slight hip hinge|Sweep the bar down to your thighs in an arc|Return overhead to a full lat stretch','Bending the elbows so it turns into a pushdown.'],

      '<div class="sethead"><span>Set</span><span>' + (e.cali ? '+kg' : 'kg') + '</span><span>' + (e.timed ? 'Sec' : 'Reps') + '</span><span>Done</span></div>' + rows +

      '<div class="rest">' + ICON.clock + '<span class="small muted">Rest</span><button type="button" aria-label="Shorter rest" ' + act('restDown', it.uid) + '>−</button><b>' + fmt(it.rest) + '</b><button type="button" aria-label="Longer rest" ' + act('restUp', it.uid) + '>+</button></div></div>' +
      '</div>';
  }).join('');
  var pct = total ? Math.round(done / total * 100) : 0;

  }).join('');

    '<div class="card"><div class="row between"><div class="h3">' + esc(S.workoutTitle) + '</div><span class="muted small">' + S.workout.length + ' exercises</span></div>' +

    '<button type="button" class="coachline" ' + act('tab', 'coach') + '><span>' + esc(coachLine) + '</span><b class="acc">Edit goals</b></button></div>' +

    (done ? '<button type="button" class="btn acc" ' + act('finish') + '>Finish &amp; save workout</button>' : '') +
    (hist ? '<div class="h3 mt">Recent workouts</div><div class="card tight">' + hist + '</div>' : '') +

}

function viewTimer() {

var TITLES = { workout: 'Today', coach: 'Coach', library: 'Exercises', plans: 'Plans', supps: 'Supplements' };

    (render.toast ? '<div class="toast" role="status">' + esc(render.toast) + '</div>' : '');
  var m2 = document.getElementById('main'), d2 = document.getElementById('detail');

// ---------- actions ----------
function updSet(uid, si, fn) { var it = findItem(uid); if (it && it.sets[si]) fn(it.sets[si]); }
function setProfile(k, v) { S.profile[k] = v; }

var ACTIONS = {
  tab: function (t) { S.tab = t; S.detail = null; render.tab = null; },
  openEx: function (id) { S.detail = id; render.det = null; },
  closeEx: function () { S.detail = null; },
  wDown: function (u, i) { updSet(+u, +i, function (s) { s.w = Math.max(0, s.w - 2.5); }); },
  wUp: function (u, i) { updSet(+u, +i, function (s) { s.w += 2.5; }); },
  rDown: function (u, i) { updSet(+u, +i, function (s) { s.r = Math.max(1, s.r - 1); }); },
  rUp: function (u, i) { updSet(+u, +i, function (s) { s.r += 1; }); },
  toggle: function (u, i) {
    var it = findItem(+u); if (!it) return;
    var s = it.sets[+i]; s.done = !s.done;
    if (!S.startedAt) S.startedAt = Date.now();
    if (s.done) { S.timer = { endAt: Date.now() + it.rest * 1000, total: it.rest, uid: it.uid, running: true, finished: false }; unlockAudio(); }
  },
  addSet: function (u) { var it = findItem(+u); if (!it) return; var l = it.sets[it.sets.length - 1] || { w: defW(EXO[it.ex].equip), r: EXO[it.ex].startReps }; it.sets.push({ w: l.w, r: l.r, done: false }); },
  dropSet: function (u) { var it = findItem(+u); if (it && it.sets.length > 1) it.sets.pop(); },
  restDown: function (u) { var it = findItem(+u); if (it) it.rest = Math.max(15, it.rest - 15); },
  restUp: function (u) { var it = findItem(+u); if (it) it.rest = Math.min(600, it.rest + 15); },
  removeItem: function (u) { S.workout = S.workout.filter(function (x) { return x.uid !== +u; }); },
  addEx: function (id) { S.workout.push(makeItem(id)); S.detail = null; S.tab = 'workout'; render.tab = null; flash('Added ' + EXO[id].name); },
  filter: function (m) { S.filter = m; },
  openSplit: function (id) { S.openSplit = S.openSplit === id ? null : id; },
  loadDay: function (sid, i) { var sp = SPLITS.find(function (s) { return s.id === sid; }); var d = sp.days[+i]; S.workout = buildDay(d.ex); S.workoutTitle = sp.name + ': ' + d.name; S.startedAt = null; S.tab = 'workout'; render.tab = null; },
  seePlan: function (sid) { S.tab = 'plans'; S.openSplit = sid; render.tab = null; },
  tier: function (k) { S.tier = k; },
  openSupp: function (id) { S.openSupp = S.openSupp === id ? null : id; },
  timerAdd: function () { var t = S.timer; var base = t.running ? t.endAt : Date.now(); S.timer = Object.assign({}, t, { endAt: base + 15000, total: t.total + 15, running: true, finished: false }); },
  timerSkip: function () { S.timer = { endAt: 0, total: 0, uid: null, running: false, finished: false }; },
  pick: function (k, v) { setProfile(k, k === 'days' ? +v : v); },
  liftWDown: function () { S.profile.liftW = Math.max(0, S.profile.liftW - 2.5); },
  liftWUp: function () { S.profile.liftW += 2.5; },
  liftRDown: function () { S.profile.liftR = Math.max(1, S.profile.liftR - 1); },
  liftRUp: function () { S.profile.liftR = Math.min(30, S.profile.liftR + 1); },
  level: function (k, j) { S.profile.levels[k] = +j; },
  buildCali: function () { S.workout = buildDay(LADDERS.map(function (L) { return L.steps[S.profile.levels[L.k] || 0]; })); S.workoutTitle = 'Calisthenics: my levels'; S.startedAt = null; S.tab = 'workout'; render.tab = null; },
  finish: function () {
    var sets = 0, vol = 0, items = [];
    S.workout.forEach(function (it) {
      var done = it.sets.filter(function (s) { return s.done; });
      if (done.length) items.push({ ex: it.ex, sets: done.map(function (s) { return { w: s.w, r: s.r }; }) });
      done.forEach(function (s) { sets++; vol += s.w * s.r; });
    });
    if (!sets) return;
    var mins = S.startedAt ? Math.max(1, Math.round((Date.now() - S.startedAt) / 60000)) : 0;
    S.history.unshift({ date: new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }), title: S.workoutTitle, sets: sets, volume: vol, mins: mins, items: items });
    S.history = S.history.slice(0, 60);
    S.workout.forEach(function (it) { it.sets.forEach(function (s) { s.done = false; }); });
    S.startedAt = null;
    ACTIONS.timerSkip();
    flash('Workout saved — great session!');
  }
};

function flash(msg) {
  render.toast = msg;
  clearTimeout(flash.t);
  flash.t = setTimeout(function () { render.toast = null; render(); }, 2200);
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.getAttribute('data-act')];
  if (!fn) return;
  fn(el.getAttribute('data-a'), el.getAttribute('data-b'));
  render();
});

document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'search') {
    S.q = el.value;
    var box = document.getElementById('exList'); if (box) box.innerHTML = viewExList();
    save();
  } else if (el.hasAttribute('data-field')) {
    S.profile[el.getAttribute('data-field')] = el.value.replace(/[^0-9.]/g, '');
    var out = document.getElementById('coachOut'); if (out) out.innerHTML = viewCoachOut();
    save();
  }
});

// ---------- rest timer: sound + vibration ----------
var audioCtx = null;
function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (err) { audioCtx = null; }
}
function beep() {
  if (navigator.vibrate) { try { navigator.vibrate([250, 120, 250]); } catch (err) { /* ignore */ } }
  if (!audioCtx) return;
  [0, 0.25, 0.5].forEach(function (t) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    var s = audioCtx.currentTime + t;
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
    o.start(s); o.stop(s + 0.2);
  });
}

setInterval(function () {
  var t = S.timer;
  if (!t.running) return;
  var left = timerLeft();
  if (left <= 0) {
    S.timer = Object.assign({}, t, { running: false, finished: true });
    beep();
    render();
    return;
  }
  var txt = fmt(left), pct = t.total ? Math.round((1 - left / t.total) * 100) : 100;
  document.querySelectorAll('[data-tleft]').forEach(function (n) { n.textContent = txt; });
  document.querySelectorAll('[data-tbar]').forEach(function (n) { n.style.width = pct + '%'; });
}, 250);

document.title = APP_NAME;
render();

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

</script>
